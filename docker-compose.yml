services:
  backend:
    build: ./Backend
    container_name: equipier_veille_backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
      - SYNC_INTERVAL_MINUTES=60
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
      args:
        - VITE_API_URL=http://localhost:8000
    container_name: equipier_veille_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
